name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write   # needed only to create the GitHub Release
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702  # v31.11.2
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build and verify
        run: nix-shell --run 'make fonts test && python3 tools/webfonts.py'
      - name: Package
        run: |
          V="${GITHUB_REF_NAME}"
          D="NullType-${V}"
          mkdir -p "dist/$D"
          cp -r fonts/ttf fonts/otf fonts/woff2 fonts/variable fonts/web css OFL.txt README.md CHANGELOG.md "dist/$D/"
          (cd dist && zip -qr "$D.zip" "$D" && sha256sum "$D.zip" > "$D.zip.sha256")
          cp fonts/SHA256SUMS dist/SHA256SUMS-fonts.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 dist/SHA256SUMS-fonts.txt --title "NullType $GITHUB_REF_NAME" --notes-file CHANGELOG.md --verify-tag
